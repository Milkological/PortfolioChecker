; Copy to config.ini (gitignored) to have an LLM write the portfolio review.
; Entirely optional — without any key the review still runs, rule-based.
;
; Configure either provider, both, or neither. Every provider with a key gets
; run and produces its own narrative; providers without one are skipped.
; Environment variables take precedence over this file:
;   [claude] -> ANTHROPIC_API_KEY
;   [gemini] -> GEMINI_API_KEY (or GOOGLE_API_KEY)
;
; Leaving a key as the "..." placeholder below counts as not configured, so you
; can delete the section you don't use or just leave it untouched.

[claude]
api_key = sk-ant-...
model = claude-opus-5

[gemini]
api_key = AIza...
model = gemini-3.8-flash
